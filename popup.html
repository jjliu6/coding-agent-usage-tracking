<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root{--card2:#1f232c;--ink:#eef1f6;--ink2:#aab2c0;--muted:#6b7382;--track:#2a2f3a;--line:#23272f;--good:#5ccf9e;--warn:#e6b45c;--bad:#e57373}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{width:100%;max-width:600px;background:#14161c;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);padding:13px;position:relative;overflow-x:hidden}
  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px}
  .brand{font-weight:700;letter-spacing:.12em;font-size:12px}
  .brand .s{color:#8fe3c6}
  .left{display:flex;align-items:center;gap:8px;min-width:0}
  .mascot{display:flex;flex-direction:column;align-items:center;gap:0;pointer-events:none}
  .mascot svg{display:block;width:72px;height:86px;overflow:visible;filter:drop-shadow(0 2px 4px rgba(0,0,0,.45))}
  .mascot .hl{display:flex;flex-direction:column;align-items:center;line-height:1.1;margin-top:-2px}
  .mascot .hl b{font-size:13px;font-variant-numeric:tabular-nums}
  .mascot .hl i{font-style:normal;font-size:8px;letter-spacing:.08em;color:var(--muted)}
  .mascot .h{transform-box:fill-box;transform-origin:50% 20%;transition:opacity .8s ease,transform .8s cubic-bezier(.2,1.15,.3,1)}
  .mascot .h.off{opacity:0;transform:translateY(-10px) rotate(14deg) scale(.72)}
  .buddy{position:fixed;z-index:30;top:54px;right:8px;width:176px;padding:10px 10px 12px;background:rgba(20,22,28,.88);border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 28px rgba(0,0,0,.35);cursor:grab;user-select:none;touch-action:none}
  .buddy.dragging{cursor:grabbing;animation:none}
  .buddy.wander .mascot{animation:buddy-bob 3.6s ease-in-out infinite}
  .buddy.dragging .mascot{animation:none}
  @keyframes buddy-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  .acts{margin-top:10px}
  .acts .ttl{font-size:11px;color:var(--ink2);line-height:1.4;margin-bottom:8px}
  .acts .note{font-size:10.5px;color:var(--muted);line-height:1.4;margin:0 0 8px}
  .acts button{display:block;width:100%;text-align:left;font-size:11.5px;line-height:1.35;color:var(--ink);background:#2a2f3a;border:none;border-radius:9px;padding:8px 9px;margin-top:6px;cursor:pointer}
  .acts button:hover{background:#333a46}
  .acts button.done{text-align:center;background:#2f5d4a;color:#d9ffe9}
  .acts button.done:hover{background:#367058}
  .right{display:flex;align-items:center;gap:10px}
  .upd{font-size:10px;color:var(--muted)}
  .leg{font-size:10px;color:var(--muted)}
  .btn{font-size:11px;color:var(--ink);background:#2a2f3a;border:none;border-radius:8px;padding:5px 12px;cursor:pointer}
  .btn:hover{background:#333a46}
  .btn.lang{padding:5px 8px;min-width:40px}
  .grid{display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:10px;align-items:start}
  .stats{overflow:hidden}
  .l0 span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .card{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px 13px}
  .chead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .name{display:flex;align-items:center;gap:7px;font-weight:650;font-size:14px}
  .dot{width:9px;height:9px;border-radius:3px}
  .plan{font-size:10px;color:var(--muted)}
  .mid{display:flex;align-items:center;gap:13px}
  .ring{position:relative;width:66px;height:66px;flex:0 0 auto}
  .ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .ring .c b{font-size:18px;line-height:1}
  .ring .c span{font-size:8.5px;letter-spacing:.1em;color:var(--muted);margin-top:2px}
  .stats{flex:1;min-width:0}
  .l0{display:flex;justify-content:space-between;font-size:11px;color:var(--ink2);gap:6px}
  .l0 .r{color:var(--muted);white-space:nowrap}
  .barwrap{margin-top:9px}
  .barwrap .t{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-bottom:3px}
  .bar{height:5px;border-radius:3px;background:var(--track);overflow:hidden}
  .bar>i{display:block;height:100%;border-radius:3px}
  .bar.stacked{display:flex}
  .bar.stacked>i{flex:none;border-radius:0}
  .barwrap .t span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .foot{display:flex;justify-content:space-between;font-size:10px;color:#8a92a0;margin-top:9px;padding-top:8px;border-top:1px solid var(--line)}
  .empty{font-size:11px;color:var(--muted);margin-top:8px;line-height:1.5}
  .empty a{color:var(--ink2)}
  .hint{font-size:10.5px;color:var(--muted);text-align:center;margin-top:12px}
  .fail{font-size:10.5px;color:var(--bad);margin-top:9px;line-height:1.4}
  .fail a{color:var(--ink2);white-space:nowrap}
  .spark{margin-top:9px;border-bottom:1px solid var(--line)}
  .spark svg{display:block;width:100%;height:26px}
  .settings{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:10px;font-size:11px;color:var(--ink2)}
  .settings label{display:flex;align-items:center;gap:5px;cursor:pointer}
  .settings .st{color:var(--muted)}
  .settings .brk{flex-basis:100%;height:0}
  [hidden]{display:none!important}
</style>
</head>
<body>
  <div class="top">
    <div class="left"><span class="brand"><span class="s">✦</span> <span id="brand-name">CODING AGENTS</span></span></div>
    <div class="right"><span class="upd" id="upd"></span><span class="leg" id="legend">number = remaining</span><button class="btn lang" id="lang" type="button" title="切换到中文">中文</button><button class="btn lang" id="gear" type="button" title="Choose tracked agents">⚙</button><button class="btn" id="refresh">Refresh</button></div>
  </div>
  <div class="settings" id="settings" hidden></div>
  <div class="grid" id="grid"></div>
  <div class="hint" id="hint"></div>
  <div class="buddy wander" id="buddy" hidden>
    <span class="mascot" id="hair" hidden></span>
    <div class="acts" id="acts" hidden></div>
  </div>
  <script src="agents.js"></script>
  <script src="i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
