name: Release

# Publishes the packaged extension zip as a GitHub Release.
# Fires when a version tag (v1.2.3) is pushed, or manually from the
# Actions tab (which tags the current commit with the manifest version).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run validate

      - run: npm test

      - name: Read manifest version
        id: manifest
        run: echo "version=$(node -p "require('./manifest.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check tag matches manifest version
        if: github.ref_type == 'tag'
        run: |
          if [ "${GITHUB_REF_NAME#v}" != "${{ steps.manifest.outputs.version }}" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version ${{ steps.manifest.outputs.version }}" >&2
            echo "Bump manifest.json (and package.json) or retag, then push again." >&2
            exit 1
          fi

      - run: npm run build

      - name: Stable-name copy for the releases/latest/download link
        run: cp "dist/coding_agents_usage-${{ steps.manifest.outputs.version }}.zip" dist/coding-agents-usage.zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.manifest.outputs.version) }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.manifest.outputs.version) }}
          generate_release_notes: true
          files: |
            dist/coding_agents_usage-${{ steps.manifest.outputs.version }}.zip
            dist/coding-agents-usage.zip
