    </g>
    <!-- face (panel mascot, smile) -->
    <path d="M27 48 Q31 46.4 35 48.2" fill="none" stroke="#3a2a20" stroke-width="1.55" stroke-linecap="round"/>
    <path d="M53 48 Q49 46.4 45 48.2" fill="none" stroke="#3a2a20" stroke-width="1.55" stroke-linecap="round"/>
    <ellipse cx="31" cy="53.2" rx="4.1" ry="4.8" fill="#fff"/>
    <ellipse cx="49" cy="53.2" rx="4.1" ry="4.8" fill="#fff"/>
    <ellipse cx="31.4" cy="53.6" rx="2.3" ry="2.7" fill="#3a2416"/>
    <ellipse cx="49.4" cy="53.6" rx="2.3" ry="2.7" fill="#3a2416"/>
    <circle cx="30.4" cy="52.2" r="1" fill="#fff"/>
    <circle cx="48.4" cy="52.2" r="1" fill="#fff"/>
    <ellipse cx="24.5" cy="58.5" rx="4.2" ry="2.1" fill="#f0a090" opacity=".45"/>
    <ellipse cx="55.5" cy="58.5" rx="4.2" ry="2.1" fill="#f0a090" opacity=".45"/>
    <path d="M39.2 57.6 Q40 59.2 40.8 57.6" fill="none" stroke="#d4a07a" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M33 62 Q40 67.5 47 62" fill="none" stroke="#3a2a20" stroke-width="2.1" stroke-linecap="round"/>
    <!-- peaked cap: tall crown, front visor, mint band, old sparkle as badge -->
    <path fill="#45587a" d="M21 27.5C21 14.5 28.2 6.2 40 6.2S59 14.5 59 27.5c-1.4-10.8-7.4-15.6-19-15.6S22.4 16.7 21 27.5z"/>
    <path fill="#3a4c68" d="M21.4 26.2c1.6 1.4 9.2 2.4 18.6 2.4s17-1 18.6-2.4C57.4 16 51.2 10.4 40 10.4S22.6 16 21.4 26.2z"/>
    <path fill="#5CD6B3" d="M22.2 25.4C24.6 24 31.2 23.2 40 23.2s15.4.8 17.8 2.2l-.6 3.4C55.2 27.6 48.4 26.8 40 26.8s-15.2.8-17.2 1.8z"/>
    <circle cx="40" cy="19.4" r="5.5" fill="#14161c"/>
    <circle cx="40" cy="19.4" r="4.35" fill="#5CD6B3"/>
    <path fill="#14161c" d="M40 15.7l1.6 3.5 3.5 1.6-3.5 1.6-1.6 3.5-1.6-3.5-3.5-1.6 3.5-1.6z"/>
