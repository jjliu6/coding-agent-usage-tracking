  <g transform="translate(64 72) scale(1.62) translate(-40 -46)">
    <ellipse cx="20" cy="52" rx="5.2" ry="7.2" fill="#f3c29a" stroke="#c47a4a" stroke-width="1.8"/>
    <ellipse cx="60" cy="52" rx="5.2" ry="7.2" fill="#f3c29a" stroke="#c47a4a" stroke-width="1.8"/>
    <ellipse cx="40" cy="52" rx="22" ry="23" fill="#f3c29a" stroke="#c47a4a" stroke-width="2.15"/>
    <!-- shiny scalp: the hairline is the mark -->
    <ellipse cx="40" cy="34" rx="11" ry="6.2" fill="#fff" opacity=".28"/>
    <ellipse cx="40" cy="40" rx="8" ry="3.6" fill="#fff" opacity=".16"/>
    <!-- horseshoe hair: sides + temple bangs, crown left bare -->
