<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Token Police mark: the panel hair mascot in a peaked cap.
       Same face / hair — he IS the quota cop. Mint band + sparkle badge
       from the old mark = a little police, not a full costume. -->
  <rect width="128" height="128" rx="28" fill="#14161c"/>
  <g transform="translate(64 70) scale(1.68) translate(-40 -44)">
    <!-- ears -->
    <ellipse cx="20" cy="52" rx="5.2" ry="7.2" fill="#f3c29a" stroke="#c47a4a" stroke-width="1.8"/>
    <ellipse cx="60" cy="52" rx="5.2" ry="7.2" fill="#f3c29a" stroke="#c47a4a" stroke-width="1.8"/>
    <!-- head -->
    <ellipse cx="40" cy="52" rx="22" ry="23" fill="#f3c29a" stroke="#c47a4a" stroke-width="2.15"/>
    <ellipse cx="40" cy="40" rx="9" ry="4.2" fill="#fff" opacity=".22"/>
    <!-- side locks + bangs (no crown hair: hat sits on the receding hairline) -->
    <g fill="#c9842c" stroke="#7a4a14" stroke-width="1.05" stroke-linejoin="round">
      <path d="M22.0 44.0 Q14.5 46.5 17.0 56.0 Q21.5 49.5 22.0 44.0 Z"/>
      <path d="M20.0 40.0 Q11.7 40.0 14.0 50.0 Q18.3 44.0 20.0 40.0 Z"/>
      <path d="M21.0 35.0 Q13.7 30.7 14.0 40.0 Q18.3 37.3 21.0 35.0 Z"/>
      <path d="M25.0 32.0 Q19.0 26.1 17.0 34.0 Q21.0 33.9 25.0 32.0 Z"/>
      <path d="M58.0 44.0 Q58.5 49.5 63.0 56.0 Q65.5 46.5 58.0 44.0 Z"/>
      <path d="M60.0 40.0 Q61.7 44.0 66.0 50.0 Q68.3 40.0 60.0 40.0 Z"/>
      <path d="M59.0 35.0 Q61.7 37.3 66.0 40.0 Q66.3 30.7 59.0 35.0 Z"/>
      <path d="M55.0 32.0 Q59.0 33.9 63.0 34.0 Q61.0 26.1 55.0 32.0 Z"/>
      <path d="M29.0 41.0 Q23.0 48.4 27.0 55.0 Q31.0 49.6 29.0 41.0 Z"/>
      <path d="M33.0 39.0 Q27.8 48.5 31.0 56.0 Q36.2 49.5 33.0 39.0 Z"/>
      <path d="M47.0 39.0 Q43.8 49.5 49.0 56.0 Q52.2 48.5 47.0 39.0 Z"/>
