    <path fill="#1e2838" d="M18.5 28.2c4.4 5.4 38.6 5.4 43 0-6.2 1.6-36.8 1.6-43 0z"/>
    <path fill="#2a3548" d="M19.8 27.8c4 2.8 36.4 2.8 40.4 0-6 .8-34.4.8-40.4 0z"/>
