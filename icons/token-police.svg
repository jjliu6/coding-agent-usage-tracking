<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Token Police mark: the panel hair mascot with a little police.
       Hat is perched on the bald spot so the receding hairline stays
       the first read — a costume hat would hide the joke. -->
